[project]
name = "ai-job-tracker-api"
version = "1.0.0"
description = "AI Job Tracker — FastAPI backend"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Md Karimul Islam" }]
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0,<2.2",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic[email]>=2.7,<3",
    "pydantic-settings>=2.3",
    "pyjwt>=2.8",
    "argon2-cffi>=23.1",
    "httpx>=0.27",
    "groq>=0.11",
    "pypdf>=5.0",
    "python-multipart>=0.0.9",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "ASYNC", "C4", "SIM", "RUF", "PT", "DTZ"]
ignore = [
    "B008",   # FastAPI's Depends() in defaults is idiomatic
    "S101",   # asserts are fine (tests, type narrowing)
    "RUF012",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"app/seed/**" = ["S311", "RUF001", "E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File", "fastapi.Cookie"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["groq.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning:pypdf.*"]

[tool.coverage.run]
source = ["app"]
omit = ["app/seed/__main__.py", "app/worker/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
